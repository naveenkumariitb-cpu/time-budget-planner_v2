<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Time Budget Planner</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Plan daily activities, durations, and schedule reminders.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { -webkit-tap-highlight-color: transparent; }
  .drag-handle { cursor: grab; touch-action: none; }
  .clock-hand { transition: transform .05s ease-out; pointer-events: none; }
  .clock-tip { pointer-events: none; stroke: #0f172a; stroke-width: 2; }
  #clockSvg { touch-action: none; user-select: none; }
  input, button { max-width: 100%; }
  .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">
<header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
 <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
   <div class="p-2 bg-indigo-600 rounded-lg">◷</div>
   <div><h1 class="font-bold text-lg text-white">Time Budget Planner</h1><p class="text-xs text-slate-400">Sequential Auto-Calculation & Cloud Sync</p></div>
  </div>
  <div class="flex flex-wrap items-center gap-2">
   <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700">
    <span class="text-xs text-slate-400 px-1">Start:</span>
    <input type="datetime-local" id="baseStartTime" class="bg-slate-800 text-slate-100 text-sm rounded px-2 py-1 border border-slate-600">
    <button id="syncNowBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded font-medium">⚡ Sync NOW</button>
   </div>
   <div class="bg-indigo-950/80 border border-indigo-700/50 rounded-lg px-3 py-2 text-xs">
    <span class="text-indigo-300">Target Bedtime:</span> <strong id="targetBedtimeDisplay" class="text-white text-sm">--:--</strong>
   </div>
  </div>
 </div>
 <div class="max-w-6xl mx-auto px-4 pb-2 flex flex-wrap items-center justify-between gap-2">
  <p id="saveStatus" role="status" class="text-xs text-emerald-300">Loading saved planner…</p>
  <div class="flex flex-wrap gap-2">
   <button id="saveNowBtn" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded">Save & Cloud Sync</button>
  </div>
 </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
 <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
  <div class="p-4 border-b border-slate-700 flex items-center justify-between flex-wrap gap-2">
   <div><h2 class="text-base font-bold text-white">Daily Activities Schedule</h2><span class="text-xs text-slate-400">Drag ⣿ to reorder activities</span></div>
   <button id="addTaskBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-semibold">+ Add Activity</button>
  </div>
  <div class="overflow-x-auto">
   <table class="w-full text-left border-collapse min-w-[760px]">
    <thead><tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
     <th class="py-3 px-2 text-center w-10">⣿</th><th class="py-3 px-3">Activity Description</th><th class="py-3 px-3 w-32 text-center">Duration</th><th class="py-3 px-3 w-28 text-center">Start Time</th><th class="py-3 px-3 w-28 text-center">End Time</th><th class="py-3 px-3 w-32 text-center">Status</th><th class="py-3 px-2 text-center w-32">Action</th>
    </tr></thead><tbody id="taskTableBody" class="divide-y divide-slate-700/60 text-sm"></tbody>
   </table>
  </div>
 </section>
</main>

<div id="clockModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
 <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-4">
  <div class="flex items-center justify-between"><h3 class="text-base font-bold">Set Duration</h3><button id="closeClockModalBtn" class="text-slate-400 p-1 text-lg">✕</button></div>
  <div class="text-center py-2 bg-slate-900 rounded-lg border border-slate-700"><span id="modalDurationText" class="text-2xl font-mono font-bold text-indigo-300">0h 0m</span></div>
  <div class="grid grid-cols-2 gap-2">
   <button id="setHoursModeBtn" type="button" aria-pressed="false" class="rounded-lg border border-slate-600 bg-slate-700 py-2.5 text-sm font-bold">🟣 Set hours</button>
   <button id="setMinutesModeBtn" type="button" aria-pressed="true" class="rounded-lg border border-sky-400 bg-sky-950 py-2.5 text-sm font-bold text-sky-200">🔵 Set minutes</button>
  </div>
  <div class="relative w-60 h-60 max-w-full mx-auto touch-none select-none">
   <svg id="clockSvg" class="w-full h-full cursor-crosshair" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#475569" stroke-width="4"/><g id="clockTicks" stroke="#64748b" stroke-width="2"></g><g id="clockNumbers" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle"></g>
    <line id="hourHand" class="clock-hand" x1="100" y1="100" x2="100" y2="53" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
    <line id="minuteHand" class="clock-hand" x1="100" y1="100" x2="100" y2="29" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle id="hourTip" class="clock-tip" cx="100" cy="53" r="5" fill="#a78bfa"/><circle id="minuteTip" class="clock-tip" cx="100" cy="29" r="4" fill="#38bdf8"/>
    <circle cx="100" cy="100" r="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
   </svg>
  </div>
  <div class="grid grid-cols-5 gap-1.5 text-xs font-semibold">
   <button data-add="5" class="bg-slate-700 py-2.5 rounded">+5m</button><button data-add="15" class="bg-slate-700 py-2.5 rounded">+15m</button><button data-add="30" class="bg-slate-700 py-2.5 rounded">+30m</button><button data-add="60" class="bg-slate-700 py-2.5 rounded">+1h</button><button id="clearDurationBtn" class="bg-rose-900/60 text-rose-200 py-2.5 rounded">Clear</button>
  </div>
  <button id="saveClockBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl">Apply Duration</button>
 </div>
</div>

<script>
(() => {
 'use strict';
 const STORAGE_KEY = 'time_budget_app_state_v2';
 const JSONBIN_ID = '6ae36c83ac6210605a5c67d5';
 const JSONBIN_API_KEY = '$2a$10$Gjejlu7w2hofqswbK/6kNuaRXSF7lWb3o6lhBu1zl1PFrJZRgaC9e';

 const defaultState = () => ({
  baseStartTime: formatDateTimeLocal(new Date()),
  tasks: [
   {id:'1',title:'Meal & Refreshment',duration:30,done:false},
   {id:'2',title:'Car & Scooty Cleaning',duration:15,done:false},
   {id:'3',title:'Gym & Workout',duration:45,done:false},
   {id:'4',title:'Officework',duration:120,done:false},
   {id:'5',title:'Lunch & Rest',duration:40,done:false},
   {id:'6',title:'Daughter Olympiad Practice',duration:90,done:false}
  ],
  alarms:[{id:'m1',label:'Review',time:'10:00',enabled:true}]
 });
 let state = defaultState(), currentModalTaskId = null, tempModalMinutes = 0, isDraggingHand = false, clockEditMode = 'minutes';
 const $ = id => document.getElementById(id);
 function formatDateTimeLocal(d) {
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
 }
 function normalise(s) {
  if (!s || typeof s !== 'object') throw new Error('Invalid data');
  const d = defaultState();
  return {
   baseStartTime: typeof s.baseStartTime === 'string' && s.baseStartTime ? s.baseStartTime : d.baseStartTime,
   tasks: Array.isArray(s.tasks) ? s.tasks.map((t,i)=>({
    id:String(t.id ?? `task-${i}`), title:String(t.title ?? 'Activity'),
    duration:Math.max(0,Math.min(1440,Number(t.duration)||30)), done:Boolean(t.done)
   })) : d.tasks,
   alarms: d.alarms
  };
 }
 function setSaveStatus(msg, ok=true) {
  $('saveStatus').textContent = msg;
  $('saveStatus').className = 'text-xs ' + (ok ? 'text-emerald-300' : 'text-amber-300');
 }
 async function syncToCloud() {
  const officeTask = state.tasks.find(t => t.title && t.title.toLowerCase().includes('officework'));
  const duration = officeTask ? officeTask.duration : 120;
  try {
   const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
    method: 'PUT',
    headers: {
     'Content-Type': 'application/json',
     'X-Master-Key': JSONBIN_API_KEY
    },
    body: JSON.stringify({ officeworkDuration: duration })
   });
   if (res.ok) setSaveStatus('✓ Saved & Cloud Synced!');
   else setSaveStatus('⚠ Saved locally, cloud sync failed', false);
  } catch(e) { setSaveStatus('✓ Saved locally (Offline)'); }
 }
 function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  syncToCloud();
 }
 function loadSaved() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { try { state = normalise(JSON.parse(raw)); } catch(e) {} }
 }
 function formatDuration(mins) { return `${Math.floor(mins/60)}h ${mins%60}m`; }
 function formatTimeOfDay(d) {
  if (isNaN(d.getTime())) return '--:--';
  let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0'), ap=h>=12?'PM':'AM'; h=h%12||12;
  return `${h}:${m} ${ap}`;
 }
 function openClockModal(id) {
  currentModalTaskId=id; const t=state.tasks.find(x=>x.id===id); tempModalMinutes=t?t.duration:30;
  setClockEditMode('minutes'); updateClockHandsDisplay(); $('clockModal').classList.remove('hidden'); $('clockModal').classList.add('flex');
 }
 function closeClockModal() { $('clockModal').classList.add('hidden'); $('clockModal').classList.remove('flex'); isDraggingHand=false; }
 function setClockEditMode(mode) {
  clockEditMode=mode;
  const hours=mode==='hours';
  $('setHoursModeBtn').setAttribute('aria-pressed',String(hours));
  $('setMinutesModeBtn').setAttribute('aria-pressed',String(!hours));
  $('setHoursModeBtn').className=hours?'rounded-lg border border-violet-400 bg-violet-950 py-2.5 text-sm font-bold text-violet-200':'rounded-lg border border-slate-600 bg-slate-700 py-2.5 text-sm font-bold';
  $('setMinutesModeBtn').className=!hours?'rounded-lg border border-sky-400 bg-sky-950 py-2.5 text-sm font-bold text-sky-200':'rounded-lg border border-slate-600 bg-slate-700 py-2.5 text-sm font-bold';
  updateClockHandsDisplay();
 }
 function updateClockHandsDisplay() {
  tempModalMinutes=Math.max(0,Math.min(1440,Math.round(tempModalMinutes)));
  $('modalDurationText').textContent=formatDuration(tempModalMinutes);
  const totalHours=Math.floor(tempModalMinutes/60), h=totalHours%12, m=tempModalMinutes%60;
  $('hourHand').setAttribute('transform',`rotate(${h*30+(m/60)*30} 100 100)`);
  $('minuteHand').setAttribute('transform',`rotate(${m*6} 100 100)`);
 }
 function initClock() {
  const g=$('clockTicks'), numbers=$('clockNumbers');
  g.innerHTML=''; numbers.innerHTML='';
  for(let i=0;i<12;i++){
   const a=i*Math.PI/6,x1=100+80*Math.sin(a),y1=100-80*Math.cos(a),x2=100+90*Math.sin(a),y2=100-90*Math.cos(a),line=document.createElementNS('http://www.w3.org/2000/svg','line');
   [['x1',x1],['y1',y1],['x2',x2],['y2',y2]].forEach(([k,v])=>line.setAttribute(k,v));g.appendChild(line);
   const label=document.createElementNS('http://www.w3.org/2000/svg','text'), nr=68, nx=100+nr*Math.sin(a), ny=100-nr*Math.cos(a);
   label.setAttribute('x',nx);label.setAttribute('y',ny);label.textContent=String(i===0?12:i);numbers.appendChild(label);
  }
  $('setHoursModeBtn').addEventListener('click',()=>setClockEditMode('hours'));
  $('setMinutesModeBtn').addEventListener('click',()=>setClockEditMode('minutes'));
  $('clockSvg').addEventListener('pointerdown',e=>{isDraggingHand=true;$('clockSvg').setPointerCapture?.(e.pointerId);dragHand(e);});
  $('clockSvg').addEventListener('pointermove',e=>{if(isDraggingHand)dragHand(e);});
  $('clockSvg').addEventListener('pointerup',()=>isDraggingHand=false);
  $('clockSvg').addEventListener('pointercancel',()=>isDraggingHand=false);
 }
 function dragHand(e) {
  const rect=$('clockSvg').getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  const x=(e.clientX-rect.left)*(200/rect.width)-100,y=(e.clientY-rect.top)*(200/rect.height)-100;
  let angle=Math.atan2(x,-y); if(angle<0)angle+=Math.PI*2;
  if(clockEditMode==='hours'){
   let hours=Math.round(angle/(Math.PI*2)*12)%12; if(hours===0)hours=12;
   tempModalMinutes=Math.min(1440,hours*60+(tempModalMinutes%60));
  } else {
   const minutes=Math.round(angle/(Math.PI*2)*60)%60;
   tempModalMinutes=Math.floor(tempModalMinutes/60)*60+minutes;
  }
  updateClockHandsDisplay();
 }
 function render() {
  const tbody=$('taskTableBody'); tbody.innerHTML='';
  let pointer=new Date(state.baseStartTime);
  state.tasks.forEach(task=>{
   const start=new Date(pointer), end=new Date(start.getTime()+(task.done?0:task.duration)*60000); pointer=end;
   const tr=document.createElement('tr'); tr.dataset.id=task.id;
   tr.className=`hover:bg-slate-700/30 transition ${task.done?'bg-slate-900/40 text-slate-500':'text-slate-200'}`;
   tr.innerHTML=`
    <td class="py-3 px-2 text-center drag-handle text-slate-500">⣿</td>
    <td class="py-3 px-3"><input type="text" value="${task.title.replace(/"/g,'&quot;')}" class="task-title bg-transparent w-full rounded px-1.5 py-1 text-sm ${task.done?'line-through text-slate-500':'text-white'}"></td>
    <td class="py-3 px-3 text-center"><button class="duration-btn bg-slate-900 px-2.5 py-1 rounded border border-slate-700 text-xs font-mono text-indigo-300">🕒 ${formatDuration(task.duration)}</button></td>
    <td class="py-3 px-3 text-center font-mono text-xs text-slate-300">${formatTimeOfDay(start)}</td>
    <td class="py-3 px-3 text-center font-mono text-xs text-indigo-300 font-semibold">${formatTimeOfDay(end)}</td>
    <td class="py-3 px-3 text-center"><button class="done-btn w-24 py-1 rounded text-xs font-bold ${task.done?'bg-emerald-600 text-white':'bg-slate-700 text-slate-300'}">${task.done?'✓ DONE':'Pending'}</button></td>
    <td class="py-3 px-2 text-center"><div class="flex justify-center items-center gap-2"><button class="copy-btn text-sky-300 p-1 text-xs font-semibold" title="Duplicate activity">⧉ Copy</button><button class="delete-btn text-rose-400 p-1 font-bold text-base" title="Delete">✕</button></div></td>`;
   tr.querySelector('.task-title').addEventListener('change',e=>{task.title=e.target.value;persist();});
   tr.querySelector('.duration-btn').addEventListener('click',()=>openClockModal(task.id));
   tr.querySelector('.done-btn').addEventListener('click',()=>{task.done=!task.done;persist();render();});
   tr.querySelector('.copy-btn').addEventListener('click',()=>{
    const copy={id:`task-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, title:task.title+' (Copy)', duration:task.duration, done:false};
    const idx=state.tasks.findIndex(t=>t.id===task.id);
    state.tasks.splice(idx+1,0,copy);
    persist(); render();
    const row=[...tbody.querySelectorAll('tr')].find(r=>r.dataset.id===copy.id);
    if(row){const f=row.querySelector('.task-title');f.focus();f.select();}
   });
   tr.querySelector('.delete-btn').addEventListener('click',()=>{if(confirm('Delete?')){state.tasks=state.tasks.filter(t=>t.id!==task.id);persist();render();}});
   tbody.appendChild(tr);
  });
  $('targetBedtimeDisplay').textContent=formatTimeOfDay(pointer);
  $('baseStartTime').value=state.baseStartTime;
  if (window.Sortable && !tbody.dataset.sortable) {
   Sortable.create(tbody,{handle:'.drag-handle',animation:150,onEnd:()=>{
    const order=[...tbody.querySelectorAll('tr')].map(tr=>state.tasks.find(t=>t.id===tr.dataset.id)).filter(Boolean);
    if(order.length===state.tasks.length){state.tasks=order;persist();render();}
   }});
   tbody.dataset.sortable='1';
  }
 }
 $('syncNowBtn').onclick=()=>{state.baseStartTime=formatDateTimeLocal(new Date());persist();render();};
 $('baseStartTime').addEventListener('change',e=>{if(e.target.value){state.baseStartTime=e.target.value;persist();render();}});
 $('addTaskBtn').onclick=()=>{
  state.tasks.push({id:`task-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,title:'New Activity',duration:30,done:false});
  persist(); render();
  const rows=[...$('taskTableBody').querySelectorAll('tr')];
  const f=rows[rows.length-1]?.querySelector('.task-title');
  if(f){f.focus();f.select();}
 };
 $('closeClockModalBtn').onclick=closeClockModal;
 $('clockModal').addEventListener('click',e=>{if(e.target===$('clockModal'))closeClockModal();});
 $('saveClockBtn').onclick=()=>{const t=state.tasks.find(x=>x.id===currentModalTaskId);if(t){t.duration=tempModalMinutes;persist();render();}$('clockModal').classList.add('hidden');};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{tempModalMinutes=Math.min(1440,tempModalMinutes+Number(b.dataset.add));updateClockHandsDisplay();});
 $('clearDurationBtn').onclick=()=>{tempModalMinutes=0;updateClockHandsDisplay();};
 $('saveNowBtn').onclick=persist;
 document.addEventListener('DOMContentLoaded',()=>{loadSaved();initClock();render();});
})();
</script>
</body>
</html>
